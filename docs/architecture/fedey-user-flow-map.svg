<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2500" viewBox="0 0 1900 2500" role="img" aria-labelledby="title desc">
  <title id="title">Fedey User Flow and System Architecture Map</title>
  <desc id="desc">Full map of the Fedey AI social media manager architecture, including login, account connection, onboarding, agent reasoning, publishing, analytics, and learning loops.</desc>
  <defs>
    <style>
      .bg { fill: #f4f9ff; }
      .panel { fill: #ffffff; stroke: #bfdfff; stroke-width: 2; rx: 24; ry: 24; }
      .section { fill: #eaf4ff; stroke: #8cc8ff; stroke-width: 2; rx: 22; ry: 22; }
      .box-user { fill: #ffffff; stroke: #5ab2ff; stroke-width: 2; rx: 18; ry: 18; }
      .box-app { fill: #f7fbff; stroke: #7ec7ff; stroke-width: 2; rx: 18; ry: 18; }
      .box-core { fill: #eef7ff; stroke: #4ca6f7; stroke-width: 2; rx: 18; ry: 18; }
      .box-ext { fill: #fffdfa; stroke: #ffb85c; stroke-width: 2; rx: 18; ry: 18; }
      .title { font: 700 38px 'Segoe UI', Tahoma, sans-serif; fill: #12324d; }
      .subtitle { font: 500 18px 'Segoe UI', Tahoma, sans-serif; fill: #53718d; }
      .section-title { font: 700 24px 'Segoe UI', Tahoma, sans-serif; fill: #0f4e7c; }
      .label { font: 700 18px 'Segoe UI', Tahoma, sans-serif; fill: #12324d; }
      .body { font: 500 15px 'Segoe UI', Tahoma, sans-serif; fill: #42637f; }
      .small { font: 500 14px 'Segoe UI', Tahoma, sans-serif; fill: #52708b; }
      .arrow-blue { stroke: #2498ff; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrow-soft { stroke: #7aaed6; stroke-width: 2.5; fill: none; marker-end: url(#arrowSoft); }
      .arrow-orange { stroke: #f59d31; stroke-width: 2.5; fill: none; marker-end: url(#arrowOrange); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2498ff"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7aaed6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f59d31"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="2500"/>

  <text class="title" x="70" y="70">Fedey: Full User Flow + System Architecture</text>
  <text class="subtitle" x="70" y="105">From hiring the agent, to connected accounts, to autonomous posting, replies, analytics, and strategy learning.</text>

  <rect class="panel" x="50" y="140" width="1800" height="380"/>
  <text class="section-title" x="80" y="180">1. Entry, Login, and Hiring Flow</text>

  <rect class="box-user" x="80" y="220" width="220" height="100"/>
  <text class="label" x="110" y="260">Visitor / Company</text>
  <text class="body" x="110" y="288">Owner, founder, or team</text>

  <rect class="box-app" x="360" y="220" width="250" height="100"/>
  <text class="label" x="390" y="260">Landing Page</text>
  <text class="body" x="390" y="288">"Hire an AI social media manager"</text>

  <rect class="box-app" x="670" y="220" width="260" height="100"/>
  <text class="label" x="700" y="260">Workspace / Login</text>
  <text class="body" x="700" y="288">Create company workspace</text>

  <rect class="box-app" x="990" y="220" width="300" height="100"/>
  <text class="label" x="1020" y="260">Job Description Intake</text>
  <text class="body" x="1020" y="288">Goals, audience, constraints, review mode</text>

  <rect class="box-app" x="1350" y="220" width="420" height="100"/>
  <text class="label" x="1380" y="260">Onboarding Session Created</text>
  <text class="body" x="1380" y="288">Session, chat thread, questions, audit state, activation state</text>

  <path class="arrow-blue" d="M300 270 L360 270"/>
  <path class="arrow-blue" d="M610 270 L670 270"/>
  <path class="arrow-blue" d="M930 270 L990 270"/>
  <path class="arrow-blue" d="M1290 270 L1350 270"/>

  <rect class="box-app" x="250" y="360" width="420" height="120"/>
  <text class="label" x="280" y="400">Possible Inputs From Hirer</text>
  <text class="body" x="280" y="430">- role title</text>
  <text class="body" x="280" y="455">- JD / brief</text>
  <text class="body" x="430" y="430">- review preference</text>
  <text class="body" x="430" y="455">- account mode: new / existing</text>

  <rect class="box-app" x="740" y="360" width="460" height="120"/>
  <text class="label" x="770" y="400">User Experience on Frontend</text>
  <text class="body" x="770" y="430">Step 1: describe role</text>
  <text class="body" x="770" y="455">Step 2: connect X / LinkedIn</text>
  <text class="body" x="1000" y="430">Step 3: chat with agent</text>
  <text class="body" x="1000" y="455">Step 4: review or auto-launch</text>

  <rect class="box-app" x="1270" y="360" width="500" height="120"/>
  <text class="label" x="1300" y="400">What the System Stores Immediately</text>
  <text class="body" x="1300" y="430">onboarding session + initial agent greeting + pending questions + status flags</text>
  <text class="body" x="1300" y="455">this becomes the anchor record for the whole lifecycle</text>

  <rect class="panel" x="50" y="560" width="1800" height="430"/>
  <text class="section-title" x="80" y="600">2. Identity, OAuth, and Connected Accounts</text>

  <rect class="box-app" x="80" y="650" width="320" height="110"/>
  <text class="label" x="110" y="690">Connect Accounts Screen</text>
  <text class="body" x="110" y="718">User connects X, LinkedIn, or both</text>
  <text class="body" x="110" y="742">User can skip one platform</text>

  <rect class="box-core" x="470" y="650" width="300" height="110"/>
  <text class="label" x="500" y="690">OAuth Account Services</text>
  <text class="body" x="500" y="718">X accounts service</text>
  <text class="body" x="500" y="742">LinkedIn accounts service</text>

  <rect class="box-ext" x="840" y="650" width="240" height="110"/>
  <text class="label" x="870" y="690">X OAuth + API</text>
  <text class="body" x="870" y="718">Account auth + publish + mentions</text>

  <rect class="box-ext" x="1140" y="650" width="270" height="110"/>
  <text class="label" x="1170" y="690">LinkedIn OAuth + API</text>
  <text class="body" x="1170" y="718">Account auth + posts + comments</text>

  <rect class="box-core" x="1480" y="650" width="290" height="110"/>
  <text class="label" x="1510" y="690">Encrypted Token Storage</text>
  <text class="body" x="1510" y="718">access tokens / refresh tokens</text>
  <text class="body" x="1510" y="742">stored in Postgres at rest</text>

  <path class="arrow-blue" d="M400 705 L470 705"/>
  <path class="arrow-orange" d="M770 705 L840 705"/>
  <path class="arrow-orange" d="M770 725 L1140 725"/>
  <path class="arrow-soft" d="M1080 705 L1480 705"/>
  <path class="arrow-soft" d="M1410 725 L1480 725"/>

  <rect class="box-app" x="150" y="820" width="500" height="120"/>
  <text class="label" x="180" y="860">Existing Account Path</text>
  <text class="body" x="180" y="890">Connected accounts let the agent inspect previous posts, cadence, reply style, and engagement patterns.</text>
  <text class="body" x="180" y="915">This is how Fedey learns structure before it starts posting.</text>

  <rect class="box-app" x="760" y="820" width="500" height="120"/>
  <text class="label" x="790" y="860">New Account Path</text>
  <text class="body" x="790" y="890">If there is no account history, the agent relies more heavily on job description, onboarding chat, and follow-up questions.</text>
  <text class="body" x="790" y="915">That gives it enough context to start from zero without sounding generic.</text>

  <rect class="box-app" x="1370" y="820" width="330" height="120"/>
  <text class="label" x="1400" y="860">Connected Status In UI</text>
  <text class="body" x="1400" y="890">Live home shows connected accounts</text>
  <text class="body" x="1400" y="915">Agent uses them during publish/reply/analytics</text>

  <rect class="panel" x="50" y="1030" width="1800" height="520"/>
  <text class="section-title" x="80" y="1070">3. Onboarding Interview, Audit, and Brand Model Creation</text>

  <rect class="box-app" x="80" y="1130" width="340" height="120"/>
  <text class="label" x="110" y="1170">Chat With Agent</text>
  <text class="body" x="110" y="1200">User asks questions naturally</text>
  <text class="body" x="110" y="1225">Agent asks only for missing context</text>

  <rect class="box-core" x="490" y="1130" width="350" height="120"/>
  <text class="label" x="520" y="1170">Agent Context Builder</text>
  <text class="body" x="520" y="1200">Collects JD, chat history, pending questions, audit state, brand memory, schedules, replies, performance, experiments</text>

  <rect class="box-ext" x="910" y="1130" width="290" height="120"/>
  <text class="label" x="940" y="1170">LLM Provider</text>
  <text class="body" x="940" y="1200">OpenAI-backed agent reasoning</text>
  <text class="body" x="940" y="1225">streamed reply UX on frontend</text>

  <rect class="box-core" x="1270" y="1130" width="500" height="120"/>
  <text class="label" x="1300" y="1170">Session Update Logic</text>
  <text class="body" x="1300" y="1200">Stores assistant reply, infers answers from natural chat, updates status, syncs brand memory</text>

  <path class="arrow-blue" d="M420 1190 L490 1190"/>
  <path class="arrow-blue" d="M840 1190 L910 1190"/>
  <path class="arrow-blue" d="M1200 1190 L1270 1190"/>

  <rect class="box-core" x="90" y="1320" width="390" height="150"/>
  <text class="label" x="120" y="1360">Historical Account Audit</text>
  <text class="body" x="120" y="1390">- fetch recent X posts</text>
  <text class="body" x="120" y="1415">- fetch recent LinkedIn posts/comments</text>
  <text class="body" x="120" y="1440">- infer tone, structure, openings, reply style</text>

  <rect class="box-core" x="540" y="1320" width="390" height="150"/>
  <text class="label" x="570" y="1360">Brand Memory Service</text>
  <text class="body" x="570" y="1390">Creates normalized memory of brand name, tone, audience, pillars, and guardrails</text>
  <text class="body" x="570" y="1415">This memory is reused in posts, replies, strategy, and agent answers</text>

  <rect class="box-core" x="990" y="1320" width="390" height="150"/>
  <text class="label" x="1020" y="1360">Activation Planner</text>
  <text class="body" x="1020" y="1390">Generates first-week plan + channel split + hypothesis</text>
  <text class="body" x="1020" y="1415">Creates real first-week content drafts and schedules</text>

  <rect class="box-app" x="1440" y="1320" width="330" height="150"/>
  <text class="label" x="1470" y="1360">Review Gate</text>
  <text class="body" x="1470" y="1390">Manual mode: user edits/approves</text>
  <text class="body" x="1470" y="1415">Auto mode: agent launches immediately</text>
  <text class="body" x="1470" y="1440">Can switch at any time</text>

  <path class="arrow-soft" d="M480 1395 L540 1395"/>
  <path class="arrow-soft" d="M930 1395 L990 1395"/>
  <path class="arrow-soft" d="M1380 1395 L1440 1395"/>

  <rect class="panel" x="50" y="1590" width="1800" height="450"/>
  <text class="section-title" x="80" y="1630">4. Live Home, Agent Operations, and User Experience After Launch</text>

  <rect class="box-app" x="80" y="1690" width="350" height="140"/>
  <text class="label" x="110" y="1730">Live Home</text>
  <text class="body" x="110" y="1760">Default destination after onboarding</text>
  <text class="body" x="110" y="1785">Shows next post, connected accounts, replies waiting, weekly growth summary</text>

  <rect class="box-app" x="490" y="1690" width="360" height="140"/>
  <text class="label" x="520" y="1730">Activity Feed</text>
  <text class="body" x="520" y="1760">Compact feed of what the agent did:</text>
  <text class="body" x="520" y="1785">audit finished, plan generated, reply drafted, post scheduled, etc.</text>

  <rect class="box-app" x="910" y="1690" width="360" height="140"/>
  <text class="label" x="940" y="1730">Ask Fedey</text>
  <text class="body" x="940" y="1760">User can keep chatting with the agent about what it is doing and why</text>
  <text class="body" x="940" y="1785">This is broader than onboarding only</text>

  <rect class="box-app" x="1330" y="1690" width="430" height="140"/>
  <text class="label" x="1360" y="1730">Ops Workspace</text>
  <text class="body" x="1360" y="1760">Advanced/internal view for deeper inspection</text>
  <text class="body" x="1360" y="1785">Not the normal customer-facing experience</text>

  <path class="arrow-blue" d="M430 1760 L490 1760"/>
  <path class="arrow-blue" d="M850 1760 L910 1760"/>
  <path class="arrow-blue" d="M1270 1760 L1330 1760"/>

  <rect class="box-core" x="210" y="1890" width="620" height="110"/>
  <text class="label" x="240" y="1930">What Users Should Feel</text>
  <text class="body" x="240" y="1958">"I hired an AI social media manager. It understands my brand, runs, tells me what it is doing, and only interrupts me when needed."</text>

  <rect class="box-core" x="930" y="1890" width="720" height="110"/>
  <text class="label" x="960" y="1930">What the Agent Should Be Able To Answer</text>
  <text class="body" x="960" y="1958">Why this posting time? What is underperforming? Which experiment is winning? What are you posting next? Why did you change strategy?</text>

  <rect class="panel" x="50" y="2080" width="1800" height="350"/>
  <text class="section-title" x="80" y="2120">5. Autonomous Execution Loop Under the Hood</text>

  <rect class="box-core" x="90" y="2180" width="220" height="110"/>
  <text class="label" x="120" y="2220">Trend Ingestion</text>
  <text class="body" x="120" y="2248">Reddit, news, live signals</text>

  <rect class="box-core" x="360" y="2180" width="220" height="110"/>
  <text class="label" x="390" y="2220">Strategy Engine</text>
  <text class="body" x="390" y="2248">Hypotheses, plan, experiments</text>

  <rect class="box-core" x="630" y="2180" width="220" height="110"/>
  <text class="label" x="660" y="2220">Content Engine</text>
  <text class="body" x="660" y="2248">Drafts, variants, hooks</text>

  <rect class="box-core" x="900" y="2180" width="220" height="110"/>
  <text class="label" x="930" y="2220">Publishing</text>
  <text class="body" x="930" y="2248">schedule, queue rules, post</text>

  <rect class="box-core" x="1170" y="2180" width="220" height="110"/>
  <text class="label" x="1200" y="2220">Community</text>
  <text class="body" x="1200" y="2248">mentions, comments, replies</text>

  <rect class="box-core" x="1440" y="2180" width="280" height="110"/>
  <text class="label" x="1470" y="2220">Performance + Learning</text>
  <text class="body" x="1470" y="2248">analytics, timelines, winners, rescheduling</text>

  <path class="arrow-blue" d="M310 2235 L360 2235"/>
  <path class="arrow-blue" d="M580 2235 L630 2235"/>
  <path class="arrow-blue" d="M850 2235 L900 2235"/>
  <path class="arrow-blue" d="M1120 2235 L1170 2235"/>
  <path class="arrow-blue" d="M1390 2235 L1440 2235"/>
  <path class="arrow-soft dash" d="M1580 2180 C1700 2080, 1700 2000, 1470 1960"/>

  <text class="small" x="80" y="2465">File generated for local download. Suggested location in repo: fedey-backend/docs/architecture/fedey-user-flow-map.svg</text>
</svg>
